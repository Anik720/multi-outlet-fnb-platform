# Render Blueprint: one-click deploy of the whole stack (Postgres + API + web).
# Render dashboard -> New -> Blueprint -> select this repository.
databases:
  - name: fnb-hq-db
    plan: free
    databaseName: fnb_hq
    user: fnb

services:
  - type: web
    name: fnb-hq-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fnb-hq-db
          property: connectionString
      - key: DB_SSL
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO_DATA
        value: "true"
      - key: CORS_ORIGINS
        sync: false # set to the web service URL, e.g. https://fnb-hq-web.onrender.com

  - type: web
    name: fnb-hq-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # e.g. https://fnb-hq-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
